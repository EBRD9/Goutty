<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Goutty</title>
<meta name="apple-mobile-web-app-title" content="Goutty">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Big Shoulders Display";src:url("fonts/big-shoulders-display.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("fonts/instrument-sans.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}

:root{
  /* One phone column, left-aligned. A state-colored stage carries the 24 h arch dial and the switch; quiet sections follow. */
  --cobalt:#2340E8;   /* gouttières portées */
  --signal:#E8530C;   /* gouttières retirées */
  --ink:#14163A;
  --muted:#5E6286;
  --bg:#F1F2F6;
  --surface:#FFFFFF;
  --line:#DCDFEA;
  --track:#E1E4F0;
  --viz-in:#2340E8;
  --viz-over:#E8530C;
  --on-viz:#FFFFFF;
  --accent-ink:#2340E8;
  --warn-ink:#A83B06;
  --danger:#B3261E;
  --focus:#14163A;
  --font-display:"Big Shoulders Display","DIN Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;
  --font-body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ECEEFB;--muted:#A3A7CE;--bg:#0B0D1E;--surface:#161935;--line:#282C52;--track:#262A4E;
    --viz-in:#6B7CFA;--viz-over:#E8662C;--on-viz:#0B0D1E;--accent-ink:#96A2FF;--warn-ink:#FF9D6B;--danger:#E2574C;--focus:#ECEEFB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#ECEEFB;--muted:#A3A7CE;--bg:#0B0D1E;--surface:#161935;--line:#282C52;--track:#262A4E;
  --viz-in:#6B7CFA;--viz-over:#E8662C;--on-viz:#0B0D1E;--accent-ink:#96A2FF;--warn-ink:#FF9D6B;--danger:#E2574C;--focus:#ECEEFB;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3,p,ul,ol,dl,dd,dt,figure{margin:0;padding:0}
ul,ol{list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{flex:none}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px}
.fig{font-family:var(--font-display);font-weight:800;line-height:1;letter-spacing:.005em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- Stage: the state is the interface ---------- */
.stage{--st-bg:var(--cobalt);--st-ink:#FFFFFF;--st-soft:rgba(255,255,255,.84);--st-track:rgba(255,255,255,.2);--st-worn:#FFFFFF;--st-out:#FF9A52;--st-btn-bg:#FFFFFF;--st-btn-ink:#101C7A;
  background:var(--st-bg);color:var(--st-ink);padding:calc(16px + env(safe-area-inset-top)) 20px 14px;border-radius:0 0 30px 30px}
.stage.out{--st-bg:var(--signal);--st-ink:#1A1030;--st-soft:#1A1030;--st-track:rgba(26,16,48,.18);--st-worn:#1A1030;--st-out:#FFFFFF;--st-btn-bg:#1A1030;--st-btn-ink:#FFFFFF}
@keyframes toOut{from{background-color:#2340E8}}
@keyframes toIn{from{background-color:#E8530C}}
.stage.flip-out{animation:toOut .5s ease}
.stage.flip-in{animation:toIn .5s ease}
.stage-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wordmark{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1;letter-spacing:.01em}
.stage-date{display:block;font-size:14px;font-weight:500;color:var(--st-soft);margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--st-track);color:var(--st-ink);white-space:nowrap}
.badge svg{width:14px;height:14px}
.loading{padding:56px 0 64px;font-size:17px;font-weight:500;color:var(--st-soft)}

.arch{position:relative;margin:2px auto 0;max-width:380px}
.arch svg{display:block;width:100%;height:auto}
.a-track{fill:none;stroke:var(--st-track);stroke-width:18;stroke-linecap:round}
.a-worn{fill:none;stroke:var(--st-worn);stroke-width:18}
.a-out{fill:none;stroke:var(--st-out);stroke-width:18}
.a-capworn{fill:var(--st-worn)}
.a-capout{fill:var(--st-out)}
.a-tick{stroke:var(--st-soft);stroke-width:1.5;stroke-linecap:round}
.a-lbl{font:500 11px var(--font-body);fill:var(--st-soft)}
.a-knob{fill:var(--st-bg);stroke:var(--st-worn);stroke-width:4}
.a-knob.out{stroke:var(--st-out)}
.arch-in{position:absolute;left:18%;right:18%;top:26%;bottom:12.5%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}
.arch-in .lbl{font-size:14px;font-weight:500;color:var(--st-soft)}
.timer{font-family:var(--font-display);font-weight:800;font-size:min(15.6vw,62px);line-height:1;display:flex;justify-content:center;margin:1px 0 3px;white-space:nowrap}
.timer b{font-weight:inherit;display:inline-block;width:.49em;text-align:center}
.timer i{font-style:normal;display:inline-block;width:.22em;text-align:center;opacity:.7}
.dayline{font-size:14px;color:var(--st-soft)}
.dayline b{font-weight:700;color:var(--st-ink)}
.switch{margin-top:11px;width:100%;min-height:54px;border-radius:17px;background:var(--st-btn-bg);color:var(--st-btn-ink);font-weight:700;font-size:17.5px;transition:transform .12s ease}
.switch:active{transform:scale(.97)}
.stage .switch:focus-visible,.stage .fix:focus-visible{outline-color:var(--st-ink)}
.fix{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:32px;padding:0 14px;font-size:13.5px;font-weight:600;color:var(--st-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;white-space:nowrap}

/* ---------- Sections ---------- */
.vh{padding:calc(26px + env(safe-area-inset-top)) 20px 0}
.vh h1{font-family:var(--font-display);font-weight:800;font-size:42px;line-height:1;text-wrap:balance}
.vh p{color:var(--muted);font-size:14px;margin-top:8px}
.sec{padding:28px 20px 0}
.sec>h2,.sec-h h2{font-size:14px;font-weight:600;color:var(--muted)}
.sec>h2{margin-bottom:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;min-height:36px}
.note{font-size:14px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted)}

.lead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:15px}
.lead .fig{font-size:44px}
.flag{flex-basis:100%;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--warn-ink);margin-bottom:4px}
.flag svg{width:16px;height:16px}
.meter{position:relative;height:12px;border-radius:6px;background:var(--track);margin-top:12px}
.meter i{position:absolute;top:0;bottom:0;display:block}
.m-in{left:0;background:var(--viz-in);border-radius:6px}
.m-in.cut{border-radius:6px 0 0 6px}
.m-over{background:var(--viz-over);border-radius:0 6px 6px 0;margin-left:2px}
.meter .m-lim{width:2px;top:-4px;bottom:-4px;background:var(--ink);border-radius:1px;transform:translateX(-2px)}
.meter-cap{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);margin-top:9px;font-variant-numeric:tabular-nums}

.due{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:inset 0 0 0 2px var(--viz-in)}
.due strong{display:block;font-size:16px}
.due p{font-size:14px;color:var(--muted)}

.tcard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:16px 18px}
.tcard .n{display:flex;align-items:baseline;gap:8px}
.tcard .n .fig{font-size:60px}
.tcard .n small{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.tcard .b{display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard .b strong{font-size:15px}
.tcard .b span{font-size:13.5px;color:var(--muted)}
.pips{display:flex;gap:3px;height:8px}
.pips i{flex:1;border-radius:2px;background:var(--track)}
.pips i.on{background:var(--viz-in)}
.pips i.now{background:transparent;box-shadow:inset 0 0 0 2px var(--viz-in)}

.rows{border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows button,.rows .row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:8px 0;text-align:left;-webkit-user-select:auto;user-select:auto}
.rows .t{font-weight:600;font-variant-numeric:tabular-nums}
.rows .t small{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.rows .d{display:flex;align-items:center;gap:6px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .d svg{width:16px;height:16px;opacity:.7}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--warn-ink);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--viz-over)}
.empty{padding:14px 0;color:var(--muted);font-size:15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:650;font-size:16px;text-align:center}
.btn.primary{background:var(--cobalt);color:#fff}
.btn.secondary{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface)}
.btn.danger{background:var(--danger);color:#fff}
.btn.textdanger{color:var(--danger);padding:0 6px}
.btn.big{min-height:56px;width:100%;font-size:18px;border-radius:17px}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 150px}
.mini{font-size:14.5px;font-weight:650;color:var(--accent-ink);min-height:36px;padding:0 2px}
.linkbtn{font-size:14.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px}

input[type="date"],input[type="datetime-local"],textarea{min-height:46px;padding:8px 12px;border-radius:13px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink);font-size:16px;max-width:100%;-webkit-appearance:none;appearance:none}
input::-webkit-date-and-time-value{text-align:left}
textarea{width:100%;resize:vertical;font-size:14px;line-height:1.35}
.stepper{display:inline-grid;grid-template-columns:46px 60px 46px;align-items:center;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.stepper.wide{grid-template-columns:46px 92px 46px}
.stepper button{height:46px;display:grid;place-items:center;color:var(--accent-ink);border-radius:14px}
.stepper button svg{width:20px;height:20px}
.stepper input,.stepper output{display:block;width:100%;height:46px;line-height:46px;border:0;background:none;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:0;box-shadow:none;border-radius:0;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.field>label,.field>.flabel{font-weight:500;flex:1 1 130px}
.fields{border-top:1px solid var(--line)}
.fields+.hint{margin-top:10px}
.syncline{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-bottom:14px}
.syncline svg{width:20px;height:20px;margin-top:1px}
.syncline.warn{color:var(--warn-ink)}

/* ---------- Onboarding ---------- */
.ob-stage{padding-bottom:26px}
.ob-h{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1.02;margin-top:26px;text-wrap:balance}
.ob-p{font-size:15.5px;margin-top:10px;color:var(--st-soft);max-width:34ch}
.ob{padding:4px 20px 8px;display:flex;flex-direction:column}
.q{padding:20px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.q>label,.qlabel{font-weight:600;font-size:17px}
.q .sub{font-size:14.5px;font-weight:500;color:var(--muted);margin-bottom:-4px}
.qrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{min-height:46px;padding:0 15px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;padding:4px;border-radius:16px;background:var(--track)}
.seg button{min-height:46px;border-radius:12px;font-weight:600;font-size:15.5px;padding:0 8px}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(8,10,28,.16)}
.ob .btn.big{margin-top:22px}
.err{color:var(--warn-ink);font-weight:600;font-size:14.5px;margin-top:12px}
.err:empty{display:none}

/* ---------- History ---------- */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;border-top:1px solid var(--line)}
.figs div{padding:14px 0 13px;border-bottom:1px solid var(--line)}
.figs dd{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1}
.figs dd small{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.figs dt{font-size:13.5px;color:var(--muted);margin-top:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.in{background:var(--viz-in)}
.sw.over{background:var(--viz-over)}
.sw.lim{height:2px;width:14px;border-radius:1px;background:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.met{background:var(--viz-in)}
.dot.miss{box-shadow:inset 0 0 0 2px var(--viz-over)}
.chart{display:block;width:100%;height:auto;margin-top:8px}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lim{stroke:var(--ink);stroke-width:1.5}
.c-in{fill:var(--viz-in)}
.c-over{fill:var(--viz-over)}
.c-part{opacity:.55}
.c-ylab{font:500 10.5px var(--font-body);fill:var(--muted)}
.c-ylab.lim{fill:var(--ink);font-weight:700}
.c-xlab{font:500 10.5px var(--font-body);fill:var(--muted)}
.c-xlab.sel{fill:var(--ink);font-weight:700}
.c-sel{fill:var(--track)}
.c-hit{fill:transparent;cursor:pointer}
.c-hit:focus-visible{outline:none;stroke:var(--focus);stroke-width:2}
.readout{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--surface)}
.readout strong{display:block;font-size:15px}
.readout span{display:block;font-size:13.5px;color:var(--muted)}
.tbl{margin-top:10px}
.tbl summary{font-size:14.5px;font-weight:600;color:var(--accent-ink);cursor:pointer;padding:10px 0}
.tblwrap{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:8px 0 8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl th{font-weight:600;color:var(--muted);font-size:13px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-h strong{font-weight:650;font-size:16px}
.cal-nav{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.cal-nav svg{width:22px;height:22px}
.cal-nav:disabled{opacity:.28;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.cal .dow{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 0 6px}
.cd{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.cd i{width:8px;height:8px;border-radius:50%}
.cd.off{color:var(--muted);opacity:.45}
.cd.off::after{content:"";height:8px}
.cd.met i{background:var(--viz-in)}
.cd.miss i{box-shadow:inset 0 0 0 2px var(--viz-over)}
.cd.cur{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.kv{border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:15px}
.kv dd{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- Treatment ---------- */
.t-num{display:flex;align-items:baseline;gap:12px}
.t-num .fig{font-size:120px;line-height:.86}
.t-num span:last-child{font-size:18px;font-weight:500;color:var(--muted)}
.t-since{margin-top:10px;font-size:15px}
.bar{height:12px;border-radius:6px;background:var(--track);margin:16px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--viz-in);border-radius:6px;min-width:6px}
.t-day{font-size:16px;margin:12px 0 16px}
.t-day strong{font-weight:700}
.trays{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.trays li{aspect-ratio:1/1;display:grid;place-items:center;border-radius:10px;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;background:var(--track);color:var(--muted)}
.trays li.done{background:var(--viz-in);color:var(--on-viz)}
.trays li.cur{background:linear-gradient(to top,color-mix(in srgb,var(--viz-in) 28%,transparent) var(--p,0%),transparent var(--p,0%));box-shadow:inset 0 0 0 2px var(--viz-in);color:var(--ink)}
.sec .legend.below{margin:12px 0 0}
.sw.done{background:var(--viz-in)}
.sw.cur{box-shadow:inset 0 0 0 2px var(--viz-in)}
.sw.todo{background:var(--track)}

/* ---------- Tabs ---------- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs[hidden]{display:none}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:600;text-decoration:none}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--accent-ink)}

/* ---------- Sheet & toast ---------- */
#sheet:empty,#toast:empty{display:none}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(8,10,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet.still{animation:none}
@keyframes up{from{transform:translateY(22px);opacity:0}}
.sh-t{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.04;margin-bottom:14px;text-wrap:balance}
.sh-p{color:var(--muted);margin-bottom:16px;font-size:15.5px}
.sh-figs{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:16px}

<script>
(() => {

/* ================= Helpers ================= */
const $ = (s, el = document) => el.querySelector(s);

const nowMs = () => (typeof window.__now === 'function' ? window.__now() : Date.now());
const now = () => Math.floor(nowMs() / 1000);
const NB = ' ';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pl = (n, w) => `${n}${NB}${w}${n > 1 ? 's' : ''}`;
const pct = x => (clamp(x, 0, 1) * 100).toFixed(2) + '%';

const D = s => new Date(s * 1000);
const sec = d => Math.floor(d.getTime() / 1000);
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

const fmtHM = s => { const m = Math.floor(Math.max(0, s) / 60); return `${Math.floor(m / 60)}${NB}h${NB}${pad(m % 60)}`; };
const fmtMin = m => (m % 60 ? `${Math.floor(m / 60)}${NB}h${NB}${pad(m % 60)}` : `${m / 60}${NB}h`);

  minus: I('<path d="M6 12h12"/>'),
  plus: I('<path d="M12 6v12M6 12h12"/>'),
  left: I('<path d="M14.5 6l-6 6 6 6"/>'),
  right: I('<path d="M9.5 6l6 6-6 6"/>'),
  warn: I('<path d="M12 4.5l8.5 15h-17z"/><path d="M12 10.5v4M12 17.3v.2"/>'),
  ok: I('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  wait: I('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  device: I('<rect x="7" y="3.5" width="10" height="17" rx="2.5"/><path d="M11 17.3h2"/>')

/* ================= State ================= */
const K = 'gouttieres1:';
const TABS = ['jour', 'historique', 'traitement', 'reglages'];
const emptyRemote = () => ({ S: null, A: {}, R: {}, docs: {} });

const st = { uid: 'local', mode: 'boot', ready: false, synced: false, err: null, prov: false, remote: emptyRemote(), pend: emptyPend() };

const LS = {
  ok: true,
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },

const obj = x => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
function loadLocal(uid) {
  const b = LS.get(K + uid);
  if (!b || typeof b !== 'object') return false;
  const r = obj(b.remote), p = obj(b.pend);
  st.remote = { S: r.S && typeof r.S === 'object' ? r.S : null, A: obj(r.A), R: obj(r.R), docs: obj(r.docs) };
  st.pend = { S: p.S && typeof p.S === 'object' ? p.S : null, A: obj(p.A), R: obj(p.R) };
  st.prov = !!b.prov;
  return true;
}
function saveLocal() { LS.set(K + st.uid, { remote: st.remote, pend: st.pend, prov: st.prov }); LS.set(K + 'last', st.uid); }

const newer = (a, b) => (!a ? b : !b ? a : (b[2] || 0) >= (a[2] || 0) ? b : a);

function rawS() { const r = st.remote.S, p = st.pend.S; return p && (!r || (p.u || 0) >= (r.u || 0)) ? p : r; }

function derive() {
  const s = rawS();
  S = s && !s.off && s.total >= 1 && s.days >= 1 && s.goal >= 60 && s.t0 > 0 ? s : null;
  const a = mergedMap('A'), r = mergedMap('R');
  A = [];
  for (const id in a) { const v = a[id]; if (Array.isArray(v) && !v[3] && v[0] >= 1 && isYmd(v[1])) A.push({ id, n: v[0], date: v[1], u: v[2] || 0 }); }

  R = [];
  for (const id in r) { const v = r[id]; if (Array.isArray(v) && !v[3] && Number.isFinite(v[0]) && v[0] > 0) R.push({ id, s: v[0], e: v[1] > 0 ? v[1] : 0 }); }

  for (const x of R) {
    const e = x.e || Infinity;
    if (e <= x.s) continue;
    const last = U[U.length - 1];

  }
}

/* ================= Time queries ================= */
function outIvs(a, b) {
  const n = now(), res = [];
  let lo = 0, hi = U.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (U[mid][0] < b) lo = mid + 1; else hi = mid; }
  for (let i = lo - 1; i >= 0; i--) {
    const e = Math.min(U[i][1], n);
    if (e <= a) break;
    const x = Math.max(U[i][0], a), y = Math.min(e, b);
    if (y > x) res.push([x, y]);
  }

}
const recsIn = (a, b) => { const n = now(); return R.filter(x => (x.e || n) > a && x.s < b); };
function dayInfo(d) {

  const a = Math.max(ds, S.t0), b = Math.min(de, n);
  const di = { d, key: ymd(d), ds, de, a, b, allow: 86400 - S.goal * 60, any: b > a, tracked: Math.max(0, b - a), out: 0, worn: 0, ivs: [], isToday: n >= ds && n < de, full: S.t0 <= ds && n >= de };
  if (di.any) { di.ivs = outIvs(a, b); for (const v of di.ivs) di.out += v[1] - v[0]; di.worn = di.tracked - di.out; }
  di.met = di.any && di.out <= di.allow;
  return di;
}
function wornSince() {
  const n = now();
  for (let i = U.length - 1; i >= 0; i--) if (U[i][1] <= n) return Math.max(S.t0, U[i][1]);
  return S.t0;
}
function treat() {
  const t = today(), cur = A[A.length - 1] || { id: '', n: 1, date: ymd(day0(D(S.t0))) };
  const start = fromYmd(cur.date), dayN = Math.max(1, diffDays(t, start) + 1);
  const due = addDays(start, S.days), left = diffDays(due, t), last = cur.n >= S.total;
  const end = addDays(due, Math.max(0, S.total - cur.n) * S.days);
  const frac = clamp((cur.n - 1 + Math.min((dayN - 1) / S.days, 1)) / S.total, 0, 1);
  return { cur, start, dayN, due, left, last, end, frac, toEnd: diffDays(end, t), done: last && left <= 0 };
}
function stats() {
  const t = today(), first = day0(D(S.t0)), nDone = Math.max(0, diffDays(t, first));
  let run = 0, best = 0, met = 0, tot = 0, fullN = 0, recN = 0;
  const worn = [];
  for (let i = 0; i < nDone; i++) {
    const di = dayInfo(addDays(first, i));
    if (!di.any) continue;
    tot++;
    if (di.met) { met++; run++; if (run > best) best = run; } else run = 0;
    if (di.full) { fullN++; worn.push(di.worn); recN += recsIn(di.ds, di.de).length; }
  }

  for (const x of R) if (x.e) { const d = x.e - x.s; sum += d; k++; if (d > mx) mx = d; }
  return { cur, best, met, tot, n7: l7.length, avg7: l7.length ? l7.reduce((p, c) => p + c, 0) / l7.length : null, perDay: fullN ? recN / fullN : null, avgDur: k ? sum / k : null, maxDur: k ? mx : null };
}

/* ================= Mutations ================= */
let lastU = 0;
const stamp = () => (lastU = Math.max(nowMs(), lastU + 1));

function putA(id, n, date, del) { st.pend.A[id] = [n, date, stamp(), del ? 1 : 0]; }
function putS(patch) { st.pend.S = Object.assign({ total: 24, days: 14, goal: 1320, t0: now() }, S || {}, patch, { u: stamp(), off: patch.off ? 1 : 0 }); }

}
async function connect() {

function goLocal() { st.mode = 'local'; st.ready = true; render(); }

function onSnap(snap) {

      r.docs[d.id] = 1;
      if (d.id === 'core') {
        if (data.S && typeof data.S === 'object') r.S = clone(data.S);
        if (data.A && typeof data.A === 'object') Object.assign(r.A, clone(data.A));
      } else if (d.id.slice(0, 2) === 'm-' && data.R && typeof data.R === 'object') { const m = clone(data.R); for (const id in m) r.R[id] = newer(r.R[id], m[id]); }

    for (const kind of ['A', 'R']) for (const id in r[kind]) st.remote[kind][id] = newer(st.remote[kind][id], r[kind][id]);

async function writeDoc(docId, patch, full) {
  const ref = col.doc(docId);

    try { await ref.update(patch); return; } catch (e) { if (!e || e.code !== 'invalid_argument') throw e; }

    const P = st.pend, core = {}, pa = {};

    for (const id in P.A) if (acked['A' + id] !== P.A[id][2]) { pa[id] = P.A[id].slice(); has = true; }
    if (Object.keys(pa).length) core.A = pa;

function exportData() {

/* ================= Actions ================= */
function setField(key, v, force) {

  if (!S) {
    if (!ob) return;
    if (key === 'total') { ob.total = clamp(v, 1, 99); ob.n = Math.min(ob.n, ob.total); }
    else if (key === 'n') ob.n = clamp(v, 1, ob.total);
    else if (key === 'days') ob.days = clamp(v, 1, 60);
    else if (key === 'goal') ob.goal = clamp(v, 720, 1410);
    render(force);
    return;
  }
  const cur = A[A.length - 1];
  if (key === 'total') { v = clamp(v, 1, 99); putS({ total: v }); if (cur && cur.n > v) putA(cur.id, v, cur.date); }
  else if (key === 'n') { v = clamp(v, 1, S.total); if (cur) putA(cur.id, v, cur.date); else putA(rid(), v, ymd(today())); }
  else if (key === 'days') putS({ days: clamp(v, 1, 60) });

let lastToggle = -1e9;
const ACT = {
  tab(name) {
    if (!TABS.includes(name)) return;
    ui.tab = name;
    try { if (location.hash !== '#' + name) location.hash = name; } catch (e) { /* hash is a convenience */ }
    render(true);
  },
  toggle() {
    const ms = performance.now();
    if (ms - lastToggle < 500) return;
    lastToggle = ms;
    const n = now();
    if (openRecs.length) {
      const recs = openRecs.slice();
      for (const x of recs) putR(x.id, x.s, Math.max(n, x.s + 1));
      ui.flip = 'in'; commit();
      toast(`Remises à ${tHM(n)}`, () => { for (const x of recs) putR(x.id, x.s, 0); });
    } else {
      const id = rid();
      putR(id, n, 0);
      ui.flip = 'out'; commit();

    }
  },
  undo() { const f = toastUndo; clearTimeout(toastT); $('#toast').innerHTML = ''; toastUndo = null; if (f) { f(); commit(); } },
  fix() {
    if (openRecs.length) return editSheet(openRecs[0]);

    for (const x of R) if (x.e && x.e <= n && (!last || x.e > last.e)) last = x;
    if (last) editSheet(last); else t0Sheet();
  },
  add(key) {
    const n = now(), t = today(), d = key && isYmd(key) ? fromYmd(key) : t;
    let s, e;
    if (ymd(d) === ymd(t)) { e = Math.floor((n - 60) / 60) * 60; if (openRecs.length) e = Math.min(e, Math.floor(openRecs[0].s / 60) * 60 - 60); s = e - 1800; }
    else { s = sec(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 30)); e = s + 1800; }
    if (s < S.t0) { s = Math.ceil(S.t0 / 60) * 60; e = Math.max(e, s + 60); }

  },
  edit(id) { const x = R.find(r => r.id === id); if (x) editSheet(x); },
  nudge(id, delta) {
    const el = document.getElementById(id); if (!el) return;

  },
  esave() {

  },
  sel(key) { ui.sel = key; render(true); },
  day(key) { if (isYmd(key)) daySheet(key); },
  cal(dir) { const p = ui.cal.split('-').map(Number), d = new Date(p[0], p[1] - 1 + Number(dir), 1); ui.cal = ymd(d).slice(0, 7); render(true); },
  next() { nextSheet(); },

  },
  step(key, dir) {

    const cur = S ? (key === 'total' ? S.total : key === 'days' ? S.days : treat().cur.n) : ob[key];

  },
  chip(v) { if (ob) { ob.days = Number(v); render(true); } },
  seg(v) { if (ob) { ob.wearing = v === '1'; render(true); } },
  obgo() {

    try { p = navigator.clipboard.writeText(json); } catch (e) { p = null; }
    if (p && p.then) p.then(() => show(true), () => show(false)); else show(false);
  },
  bcopy() {
    const el = $('#b-json'); if (!el) return;
    el.focus(); el.select();
    try { navigator.clipboard.writeText(el.value).then(() => toast('Sauvegarde copiée'), () => toast('Copie impossible : sélectionne le texte à la main')); } catch (e) { toast('Copie impossible : sélectionne le texte à la main'); }
  },
  restore() {
    pushSheet({ html: () => `<h2 class="sh-t" id="sh-title">Restaurer une sauvegarde</h2><p class="sh-p">Colle ici le texte d'une sauvegarde. Elle remplace toutes les données actuelles.</p><textarea id="r-json" rows="6" aria-label="Texte de la sauvegarde" placeholder='{"app":"suivi-gouttieres", …}'></textarea><p class="err" id="r-err" role="alert"></p><div class="sh-actions"><span class="grow"></span><button type="button" class="btn secondary" data-act="sheet-close">Annuler</button><button type="button" class="btn danger" data-act="ryes">Remplacer mes données</button></div>` });
  },
  ryes() {
    let o = null;
    try { o = JSON.parse($('#r-json').value); } catch (e) { o = null; }
    try { importData(o); } catch (e) { $('#r-err').textContent = "Ce texte n'est pas une sauvegarde de cette app. Colle-le en entier, sans rien changer."; return; }
    sheets.length = 0; drawSheet(); commit();
    toast('Sauvegarde restaurée');
  },
  reset() {
    confirmSheet({ title: 'Tout effacer ?', text: 'Tes retraits, tes gouttières et tes réglages seront supprimés, ici et dans la sauvegarde en ligne. Impossible de revenir en arrière.', yes: 'Tout effacer', danger: true, onYes: () => {
      for (const x of R) putR(x.id, x.s, x.e, 1);
      for (const x of A) putA(x.id, x.n, x.date, 1);
      putS({ off: 1 });
      ob = null; ui.tab = 'jour'; ui.sel = null; ui.cal = null;
      commit();
    } });
  },
  cyes() { const top = sheets.pop(); drawSheet(true); if (top && top.onYes) top.onYes(); },
  t0save() {
    const t = fromInput($('#t-0').value), msg = checkT0(t);
    if (msg) { $('#t-err').textContent = msg; return; }
    putS({ t0: t });
    sheets.pop(); drawSheet(true); commit();
  },
  'sheet-close'() { popSheet(); }
};
const CHG = {
  num(el, key) { setField(key, parseInt(el.value, 10), false); },
  obdate(el) { if (ob && isYmd(el.value) && el.value <= ymd(today())) ob.date = el.value; else if (ob) el.value = ob.date; },
  obsince(el) { const t = fromInput(el.value); if (ob && t != null && t <= now() + 60) ob.since = t; else if (ob) el.value = toInput(ob.since == null ? now() : ob.since); },
  adate(el) {
    const cur = A[A.length - 1], prev = A[A.length - 2], v = el.value;
    if (!cur || !isYmd(v) || v > ymd(today()) || (prev && v < prev.date)) { toast(prev ? `Choisis un jour entre le ${F.dm.format(fromYmd(prev.date))} et aujourd'hui.` : "Choisis un jour qui n'est pas dans le futur."); if (cur) el.value = cur.date; return; }
    putA(cur.id, cur.n, v); commit(false);
  },
  t0(el) {
    const t = fromInput(el.value), msg = checkT0(t);
    if (msg) { toast(msg); el.value = toInput(S.t0); return; }
    putS({ t0: t }); commit(false);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const parts = el.dataset.act.split(':');
  if (parts[0] === 'sheet-bg') { if (e.target === el) popSheet(); return; }
  const fn = ACT[parts[0]];
  if (fn) { e.preventDefault(); fn(parts[1], parts[2], el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheets.length) { popSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof Element && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('change', e => {
  const el = e.target instanceof Element ? e.target.closest('[data-chg]') : null;
  if (!el) return;
  const parts = el.dataset.chg.split(':'), fn = CHG[parts[0]];
  if (fn) fn(el, parts[1]);
});
document.addEventListener('focusout', () => { if (ui.dirty) setTimeout(() => render(), 0); });
$('#view').addEventListener('scroll', () => { ui.scrolled = performance.now(); }, { passive: true });
document.addEventListener('toggle', e => { if (e.target instanceof Element && e.target.matches('details.tbl')) ui.tbl = e.target.open; }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); flush(); } });
window.addEventListener('online', () => flush());
window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (TABS.includes(h) && h !== ui.tab) { ui.tab = h; render(true); } });

/* ================= Boot ================= */
function boot(saved) {
  const last = LS.get(K + 'last');
  if (typeof last === 'string' && last && loadLocal(last)) st.uid = last; else loadLocal('local');
  derive();
  st.ready = !!S;
  const h = (location.hash || '').slice(1), sv = saved && typeof saved.tab === 'string' ? saved.tab : '';
  ui.tab = TABS.includes(h) ? h : TABS.includes(sv) ? sv : 'jour';
  render(true);
  connect();
  setInterval(tick, 1000);
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: ui.tab })); } catch (e) { /* optional */ }
let booted = false;
const start = saved => { if (booted) return; booted = true; boot(saved || {}); };
try { if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot && hot.data); } catch (e) { start({}); }
setTimeout(() => start({}), 1500);
})();
</script>
